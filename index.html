<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="darkreader-lock">
    <meta name="theme-color" content="#000000">
    <title>big biznis here</title>
    <link rel="icon" type="image/png" href="fav.png">
    <link rel="apple-touch-icon" href="fav.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Montserrat:wght@400;500;700&display=swap">
    <style>
        :root {
            color-scheme: dark;
            forced-color-adjust: none;
            --text-color: #F3F4F4;
            --outline-color: #F3F4F4;
            --downtime-border: #853953;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #000000 !important;
            color: #F3F4F4 !important;
            font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }
        .landing-img {
            display: block;
            margin: 0 auto;
            width: 70%;
            height: 50vh;
            object-fit: fill;
        }
        .greeting {
            font-family: "Comic Sans MS", "Comic Sans", "Comic Neue", cursive;
            font-size: 5rem;
            margin-top: 30px;
            color: #F3F4F4 !important;
        }
        .button-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            margin: 2.5em auto;
            width: 100%;
            max-width: 20rem;
        }
        .button {
            width: 100%;
            padding: 1rem 1rem;
            text-align: center;
            border: 1px solid #F3F4F4;
            color: #F3F4F4 !important;
            background: transparent !important;
            cursor: pointer;
            font-size: 1.125rem;
            font-weight: 500;
            letter-spacing: 0.025em;
            outline: none;
            user-select: none;
            text-decoration: none;
            display: block;
            box-shadow: none;
            border-radius: 0;
            transition: none !important;
            animation: none !important;
        }
        .button:hover, .button:active, .button:focus {
            background: transparent !important;
            color: #F3F4F4 !important;
            box-shadow: none !important;
            outline: none !important;
        }
        .text {
            color: #F3F4F4 !important;
            font-family: "Montserrat", sans-serif;
            font-weight: 500;
            margin: auto;
            width: fit-content;
            transition: none !important;
        }
        .button:hover .text, .button:active .text {
            transform: none !important;
        }

        /* Downtime banner with #853953 outline */
        #downtime-banner {
            display: none;
            width: 85%;
            margin: 0 auto 2.5em auto;
            border: 1px solid #853953;
            border-radius: 0;
            padding: 1rem 1.25rem;
            box-sizing: border-box;
            background: transparent;
            text-align: center;
        }
        #downtime-banner .downtime-label {
            font-family: "Montserrat", sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: #F3F4F4 !important;
            text-transform: uppercase;
            margin-bottom: 0.4em;
        }
        #downtime-banner .downtime-message {
            font-family: "Montserrat", sans-serif;
            font-size: 0.95rem;
            color: #F3F4F4 !important;
        }
        #downtime-banner .downtime-message p {
            margin: 0.25em 0;
            color: #F3F4F4 !important;
        }

        /* Extension & Dark Reader isolation */
        [data-darkreader-inline-bgcolor],
        [data-darkreader-inline-color],
        [data-darkreader-inline-border] {
            background-color: #000000 !important;
            color: #F3F4F4 !important;
        }
    </style>
</head>
<body>
    <a href="https://youtu.be/Srz0k_MBUHk">
        <img src="landing.png" alt="Landing Image" class="landing-img">
    </a>
    <h1 class="greeting">Oye mate!</h1>
    <div class="button-row">
        <a href="https://matee.xyz/main" class="button">
            <div class="text">Nyilvános Szolgáltatások</div>
        </a>
        <a href="https://auth.matee.xyz" class="button">
            <div class="text">Belső Portál</div>
        </a>
    </div>

    <div id="downtime-banner">
        <div class="downtime-label">Tervezett üzemszünet</div>
        <div class="downtime-message" id="downtime-text"></div>
    </div>

    <script>
        const FIREBASE_URL = 'https://downtime-message-default-rtdb.europe-west1.firebasedatabase.app/downtime_message.json';

        fetch(FIREBASE_URL)
            .then(r => r.json())
            .then(msg => {
                if (msg && msg.trim() !== '') {
                    const el = document.getElementById('downtime-text');
                    msg.split('$').forEach(line => {
                        const p = document.createElement('p');
                        p.textContent = line;
                        el.appendChild(p);
                    });
                    document.getElementById('downtime-banner').style.display = 'block';
                }
            })
            .catch(() => {});
    </script>
</body>
</html>
